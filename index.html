<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>15 Greenleaf Ave — Countdown</title>
<meta name="description" content="A countdown to September 17, 2026 at 12:00 PM at 15 Greenleaf Ave, Medford MA.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
<style>
  :root{
    --ink:#2f3d55;
    --ink-soft:#6a7a95;
    --card:#fffdf9;
    --accent:#ff7fa8;
    --accent-2:#5aa86a;
    --gold:#ffc94d;
    --shadow:0 18px 40px -18px rgba(47,61,85,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh; min-height:100svh;
    font-family:"Nunito", ui-rounded, "Segoe UI Rounded", "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 15% -10%, #ffe3ee 0%, transparent 60%),
      radial-gradient(1000px 600px at 90% 0%, #dff1ff 0%, transparent 55%),
      linear-gradient(180deg,#fef7ff 0%, #eef7ff 55%, #f3fff2 100%);
    display:flex; flex-direction:column; align-items:center;
    padding:clamp(16px,3vw,36px) clamp(12px,3vw,32px) 48px;
    overflow-x:hidden;
  }

  /* floating hearts / leaves background */
  .floaties{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden}
  .floaties span{
    position:absolute; bottom:-60px; font-size:22px; opacity:.35;
    animation:drift linear infinite;
  }
  @keyframes drift{
    0%{transform:translateY(0) rotate(0deg)}
    100%{transform:translateY(-115vh) rotate(360deg)}
  }

  main{position:relative; z-index:1; width:min(1100px,100%); text-align:center}

  .eyebrow{
    display:inline-flex; align-items:center; gap:.5em;
    background:var(--card); border:2px solid #ffe0ec; border-radius:999px;
    padding:.45em 1.1em; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
    font-size:clamp(11px,1.6vw,13px); color:var(--accent); box-shadow:var(--shadow);
  }

  h1{
    margin:.5em 0 .1em;
    font-size:clamp(30px,6.5vw,64px);
    line-height:1.05; font-weight:900; letter-spacing:-.02em;
  }
  h1 .ave{display:block; font-size:.55em; color:var(--ink-soft); font-weight:800; letter-spacing:.02em}

  .house{
    width:min(440px,74%); margin:clamp(12px,2vw,18px) auto clamp(10px,2vw,18px);
    border-radius:26px; overflow:hidden; background:var(--card);
    border:6px solid #fff; box-shadow:var(--shadow);
    transform:rotate(-1.2deg);
    transition:transform .4s ease;
  }
  @media (hover:hover){ .house:hover{transform:rotate(0deg) scale(1.015)} }
  .house img{display:block; width:100%; height:auto}

  .target{
    font-weight:800; color:var(--ink-soft);
    font-size:clamp(14px,2.2vw,19px); margin:.2em 0 clamp(14px,2.5vw,26px);
  }
  .target b{color:var(--ink)}

  .clock{width:100%}

  .bigwrap{
    background:var(--card); border-radius:32px; border:4px solid #fff;
    box-shadow:var(--shadow); padding:clamp(16px,3.2vw,40px) clamp(10px,2vw,28px) clamp(14px,2.6vw,30px);
    position:relative; overflow:hidden;
  }
  .bigwrap::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:6px;
    background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent-2),#5ea9e6);
    opacity:.6;
  }
  .caption{
    display:block; margin-bottom:clamp(4px,1vw,10px);
    font-weight:800; letter-spacing:.16em; text-transform:lowercase;
    font-size:clamp(11px,2vw,17px); color:var(--ink-soft);
  }

  .num{
    display:block; font-variant-numeric:tabular-nums; font-weight:900;
    font-size:clamp(46px,15.5vw,190px); line-height:.92; letter-spacing:-.045em;
    white-space:nowrap;
    background:linear-gradient(180deg,#41567a,#2b3a52);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .num.tick{animation:pop .4s cubic-bezier(.3,1.5,.5,1)}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.025)}100%{transform:scale(1)}}

  .seclabel{
    display:block; margin-top:.35em; font-weight:900; text-transform:uppercase;
    letter-spacing:.34em; font-size:clamp(11px,2.1vw,20px); color:var(--accent);
    padding-left:.34em;
  }

  .parts{
    display:flex; flex-wrap:wrap; justify-content:center; align-items:baseline;
    gap:clamp(6px,1.4vw,16px); margin-top:clamp(12px,2vw,20px);
    color:var(--ink-soft); font-weight:800;
    font-size:clamp(12px,2.1vw,18px); letter-spacing:.02em;
  }
  .parts b{
    color:var(--ink); font-weight:900; font-variant-numeric:tabular-nums;
    font-size:1.28em; letter-spacing:-.01em;
  }
  .parts .dot{opacity:.4}

  footer{margin-top:clamp(20px,3vw,34px); color:var(--ink-soft); font-weight:700; font-size:clamp(12px,1.8vw,15px)}
  footer .heart{color:var(--accent)}

  /* ---- celebration ---- */
  body.party{animation:bgparty 3s ease-in-out infinite}
  @keyframes bgparty{
    0%,100%{background-color:#fff}
    33%{background-color:#fff4fa}
    66%{background-color:#f2fbff}
  }
  .party h1{animation:wiggle 1.2s ease-in-out infinite}
  @keyframes wiggle{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
  .party .house{animation:hop 1s ease-in-out infinite}
  @keyframes hop{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-14px) rotate(1.2deg)}}

  .banner{
    display:none; margin:0 auto clamp(12px,2vw,20px); max-width:900px;
    font-size:clamp(26px,6vw,60px); font-weight:900; line-height:1.1;
    background:linear-gradient(90deg,#ff7fa8,#ffc94d,#5aa86a,#5ea9e6,#ff7fa8);
    background-size:300% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:rainbow 6s linear infinite;
  }
  .party .banner{display:block}
  .party .clock{display:none}
  .party .target{display:none}
  @keyframes rainbow{to{background-position:300% 0}}

  #confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:50; display:none}
  .party #confetti{display:block}

  @media (max-width:620px){
    body{padding-bottom:28px}
    .eyebrow{padding:.4em .9em; letter-spacing:.04em}
    h1{margin:.45em 0 .05em; font-size:clamp(26px,7.6vw,40px)}
    h1 .ave{font-size:.5em}
    .house{width:88%; border-width:5px; border-radius:20px; margin:12px auto 12px}
    .target{font-size:12.5px; line-height:1.4; margin:.2em auto 14px; max-width:27em; opacity:.9}
    .target b{font-weight:800}
    .bigwrap{border-radius:24px; padding:16px 10px 14px}
    .caption{font-size:12px; letter-spacing:.14em; margin-bottom:6px}
    .seclabel{font-size:12px; letter-spacing:.3em; margin-top:.45em}

    /* stack each unit as number-over-label instead of a wrapping sentence */
    .parts{
      display:grid; grid-template-columns:repeat(4,1fr);
      gap:0; margin-top:14px; font-size:10px;
      text-transform:uppercase; letter-spacing:.09em;
    }
    .parts span{display:flex; flex-direction:column; align-items:center; gap:1px}
    .parts b{font-size:19px; line-height:1.1}
    .parts .dot{display:none}
    footer{margin-top:20px; font-size:12px}
    .banner{font-size:clamp(24px,8vw,40px)}
  }

  @media (max-width:620px) and (orientation:landscape){
    .house{width:min(300px,46%)}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important}
  }
</style>
</head>
<body>
<div class="floaties" id="floaties" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<main>
  <span class="eyebrow">🏡 Home sweet home</span>

  <h1>15 Greenleaf Ave
    <span class="ave">Medford, Massachusetts</span>
  </h1>

  <figure class="house">
    <!-- house.jpg is the real listing photo; house.svg is the fallback illustration. -->
    <img src="house.jpg" alt="15 Greenleaf Ave, Medford MA"
         onerror="this.onerror=null;this.src='house.svg'">
  </figure>

  <p class="target">Counting down to <b>Thursday, September 17, 2026 at 12:00&nbsp;PM</b> <span style="white-space:nowrap">(Medford time)</span></p>

  <p class="banner" id="banner">🎉 It's time! 🎉<br>Welcome home 🏡💚</p>

  <div class="clock" id="clock">
    <div class="bigwrap">
      <span class="caption">burbas close in</span>
      <span class="num" id="secs">&mdash;</span>
      <span class="seclabel">seconds</span>
      <p class="parts">
        <span><b id="d">--</b> days</span><span class="dot">&middot;</span>
        <span><b id="h">--</b> hours</span><span class="dot">&middot;</span>
        <span><b id="m">--</b> minutes</span><span class="dot">&middot;</span>
        <span><b id="s">--</b> seconds</span>
      </p>
    </div>
  </div>

  <footer>made with <span class="heart">♥</span> for 15 Greenleaf Ave</footer>
</main>

<script>
(function(){
  "use strict";

  // Sep 17 2026, 12:00 PM in Medford, MA (EDT = UTC-4)
  var TARGET = new Date("2026-09-17T12:00:00-04:00").getTime();

  var els = { secs: document.getElementById("secs"), d: document.getElementById("d"),
              h: document.getElementById("h"), m: document.getElementById("m"),
              s: document.getElementById("s") };
  var last = {};

  function pad(n){ return n < 10 ? "0" + n : String(n); }

  // 1296432 -> "1,296,432"
  function group(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

  function set(key, value){
    if (last[key] === value) return;
    last[key] = value;
    var el = els[key];
    el.textContent = value;
    el.classList.remove("tick");
    void el.offsetWidth; // restart animation
    el.classList.add("tick");
  }

  var celebrating = false;

  function render(){
    var left = TARGET - Date.now();
    if (left <= 0){
      set("secs","0"); maybeFit(); set("d","0"); set("h","00"); set("m","00"); set("s","00");
      if (!celebrating) celebrate();
      return;
    }
    var totalSec = Math.ceil(left / 1000);
    set("secs", group(totalSec));
    maybeFit();
    set("d", String(Math.floor(totalSec / 86400)));
    set("h", pad(Math.floor(totalSec / 3600) % 24));
    set("m", pad(Math.floor(totalSec / 60) % 60));
    set("s", pad(totalSec % 60));
  }

  /* Size the big number to fill the card. A vw-based clamp can't do this:
     the digit count shrinks as the date nears, and the card is narrower than
     the viewport by a padding that itself changes with screen size. */
  var MAX_PX = 190;
  var fitFor = "";

  function fit(){
    var el = els.secs;
    el.style.fontSize = "100px";
    var avail = el.clientWidth;   // the block's width == the space to fill
    // A Range measures the glyphs themselves; scrollWidth would just report
    // the block width back whenever the text is narrower than the card.
    var r = document.createRange();
    r.selectNodeContents(el);
    var text = r.getBoundingClientRect().width;
    if (!avail || !text) { el.style.fontSize = ""; return; }
    var px = Math.min(MAX_PX, Math.floor(100 * (avail * 0.98) / text));
    el.style.fontSize = px + "px";
    fitFor = el.textContent.length + "x" + avail;
  }

  function maybeFit(){
    var el = els.secs;
    if (fitFor !== el.textContent.length + "x" + el.clientWidth) fit();
  }

  render();
  fit();
  setInterval(render, 250);
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  /* ---------- floating background bits ---------- */
  (function floaties(){
    var box = document.getElementById("floaties");
    var glyphs = ["🍃","💚","🏡","🌸","✨","🍂"];
    var small = window.matchMedia("(max-width: 620px)").matches;
    var n = small ? 9 : 18;
    for (var i = 0; i < n; i++){
      var s = document.createElement("span");
      s.textContent = glyphs[i % glyphs.length];
      s.style.left = (Math.random() * 100) + "%";
      s.style.fontSize = ((small ? 12 : 14) + Math.random() * (small ? 12 : 22)) + "px";
      s.style.opacity = small ? .22 : "";
      s.style.animationDuration = (14 + Math.random() * 16) + "s";
      s.style.animationDelay = (-Math.random() * 30) + "s";
      box.appendChild(s);
    }
  })();

  /* ---------- celebration ---------- */
  function celebrate(){
    celebrating = true;
    document.body.classList.add("party");
    document.title = "🎉 Welcome home! 🏡";
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    confetti();
  }

  function confetti(){
    var cv = document.getElementById("confetti");
    var ctx = cv.getContext("2d");
    var dpr = window.devicePixelRatio || 1;
    var W, H;

    function size(){
      W = cv.clientWidth; H = cv.clientHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    size();
    window.addEventListener("resize", size);

    var colors = ["#ff7fa8","#ffc94d","#5aa86a","#5ea9e6","#c58cf5","#ffffff"];
    var bits = [];

    function burst(n, originY){
      for (var i = 0; i < n; i++){
        bits.push({
          x: Math.random() * W,
          y: originY - Math.random() * H * 0.4,
          vx: (Math.random() - 0.5) * 3,
          vy: 1 + Math.random() * 3.5,
          w: 6 + Math.random() * 8,
          h: 8 + Math.random() * 10,
          rot: Math.random() * Math.PI * 2,
          vr: (Math.random() - 0.5) * 0.25,
          color: colors[(Math.random() * colors.length) | 0],
          sway: Math.random() * Math.PI * 2
        });
      }
    }

    burst(220, -40);
    var again = setInterval(function(){ if (bits.length < 400) burst(90, -40); }, 1400);
    setTimeout(function(){ clearInterval(again); }, 60000);

    (function frame(){
      ctx.clearRect(0, 0, W, H);
      for (var i = bits.length - 1; i >= 0; i--){
        var b = bits[i];
        b.sway += 0.05;
        b.x += b.vx + Math.sin(b.sway) * 0.9;
        b.y += b.vy;
        b.rot += b.vr;
        if (b.y > H + 40){ bits.splice(i, 1); continue; }
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.rot);
        ctx.fillStyle = b.color;
        ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
        ctx.restore();
      }
      requestAnimationFrame(frame);
    })();
  }

  // For a dry run of the finale: append ?party to the URL.
  if (/[?&]party\b/.test(location.search)) celebrate();
})();
</script>
</body>
</html>
